          name: emr-dynamic-sizing-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            strategy: {}
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                creationTimestamp: null
                labels:
                  control-plane: controller-manager
              spec:
                containers:
                - args:
                  - --health-probe-bind-address=:8081
                  - --leader-elect
                  command:
                  - /manager
                  image: 755674844232.dkr.ecr.us-east-1.amazonaws.com/dynamic-sizing-k8s-operator/emr-7.5.0:latest
                  imagePullPolicy: Always
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: 8081
                    initialDelaySeconds: 15
                    periodSeconds: 20
                  name: manager
                  readinessProbe:
                    httpGet:
                      path: /readyz
                      port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    limits:
                      cpu: 500m
                      memory: 128Mi
                    requests:
                      cpu: 10m
                      memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                serviceAccountName: emr-dynamic-sizing-controller-manager
                terminationGracePeriodSeconds: 10
        - name: vpa-admission-controller
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: vpa-admission-controller
            strategy: {}
            template:
              metadata:
                creationTimestamp: null
                labels:
                  app: vpa-admission-controller
              spec:
                containers:
                - args:
                  - --client-ca-file=/tmp/vpa-operator/serving-certs/olmCAKey
                  - --tls-cert-file=/tmp/vpa-operator/serving-certs/tls.crt
                  - --tls-private-key=/tmp/vpa-operator/serving-certs/tls.key
                  - --register-webhook=false
                  - --v=4
                  - --stderrthreshold=info
                  command:
                  - ./admission-controller
                  env:
                  - name: NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  image: registry.k8s.io/autoscaling/vpa-admission-controller:0.12.0
                  imagePullPolicy: Always
                  name: admission-controller
                  ports:
                  - containerPort: 8000
                    name: webhook-server
                    protocol: TCP
                  - containerPort: 8944
                    name: prometheus
                    protocol: TCP
                  resources:
                    limits:
                      cpu: 200m
                      memory: 500Mi
                    requests:
                      cpu: 50m
                      memory: 200Mi
                  volumeMounts:
                  - mountPath: /tmp/vpa-operator/serving-certs
                    name: vpa-operator-cert
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                serviceAccountName: vpa-admission-controller
                volumes:
                - name: vpa-operator-cert
                  secret:
                    defaultMode: 420
                    secretName: vpa-admission-controller-service-cert
        - name: vpa-recommender
          spec:
            replicas: 1
            selector:
